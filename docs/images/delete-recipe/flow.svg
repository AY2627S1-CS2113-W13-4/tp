<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:578px;height:1008px;background:#FFFFFF;" width="578px" height="1008px" viewBox="0 0 578 1008" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="7"><text x="122.713" y="33.132" fill="#000" font-size="14" textLength="331.44" font-weight="700" font-family="Arial">Deleting a recipe: where each outcome is decided</text></g><ellipse cx="276.294" cy="62.099" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="164.364" y="92.099" width="223.861" height="36.099" fill="#F5F8FC" style="stroke:#475569;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="174.364" y="115.23" fill="#000" font-size="14" textLength="203.861" font-family="Arial">User enters delete-recipe INDEX</text><rect x="158.532" y="206.444" width="235.523" height="52.197" fill="#F5F8FC" style="stroke:#475569;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="168.532" y="229.576" fill="#000" font-size="14" textLength="215.523" font-family="Arial">Parser throws MishMashException</text><text x="168.532" y="245.674" fill="#000" font-size="14" textLength="176.641" font-family="Arial">with the delete-recipe format</text><rect x="178.763" y="280.74" width="195.062" height="36.099" fill="#F5F8FC" style="stroke:#475569;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="188.763" y="303.872" fill="#000" font-size="14" textLength="175.062" font-family="Arial">MishMash displays the error</text><ellipse cx="276.294" cy="347.838" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="276.294" cy="347.838" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="150.236,148.197,402.352,148.197,414.352,164.296,402.352,180.395,150.236,180.395,138.236,164.296,150.236,148.197" fill="#FFF9E8" style="stroke:#C4AC70;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="280.294" y="193.526" fill="#000" font-size="14" textLength="15.572" font-family="Arial">no</text><text x="150.236" y="161.329" fill="#000" font-size="14" textLength="252.116" font-family="Arial">INDEX is a single positive whole number</text><text x="150.236" y="177.428" fill="#000" font-size="14" textLength="125.303" font-family="Arial">within the int range?</text><text x="414.352" y="161.329" fill="#000" font-size="14" textLength="21.786" font-family="Arial">yes</text><rect x="118.46" y="459.085" width="315.668" height="36.099" fill="#F5F8FC" style="stroke:#475569;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="128.46" y="482.217" fill="#000" font-size="14" textLength="295.668" font-family="Arial">confirmationPrompt throws MishMashException</text><rect x="178.763" y="515.184" width="195.062" height="52.197" fill="#F5F8FC" style="stroke:#475569;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="188.763" y="538.315" fill="#000" font-size="14" textLength="175.062" font-family="Arial">MishMash displays the error</text><text x="188.763" y="554.414" fill="#000" font-size="14" textLength="157.179" font-family="Arial">and all command formats</text><ellipse cx="276.294" cy="598.381" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="276.294" cy="598.381" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="171.236,400.838,381.352,400.838,393.352,416.937,381.352,433.036,171.236,433.036,159.236,416.937,171.236,400.838" fill="#FFF9E8" style="stroke:#C4AC70;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="280.294" y="446.167" fill="#000" font-size="14" textLength="21.786" font-family="Arial">yes</text><text x="171.236" y="413.97" fill="#000" font-size="14" textLength="154.068" font-family="Arial">Recipe book is empty, or</text><text x="171.236" y="430.069" fill="#000" font-size="14" textLength="210.116" font-family="Arial">INDEX exceeds the recipe count?</text><text x="393.352" y="413.97" fill="#000" font-size="14" textLength="15.572" font-family="Arial">no</text><rect x="77.291" y="651.381" width="398.007" height="52.197" fill="#F5F8FC" style="stroke:#475569;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="87.291" y="674.513" fill="#000" font-size="14" textLength="96.469" font-family="Arial">MishMash asks</text><text x="87.291" y="690.611" fill="#000" font-size="14" textLength="378.007" font-family="Arial">"Are you sure you want to delete recipe INDEX: name? (y/n)"</text><polygon points="196.539,723.578,356.049,723.578,368.049,739.677,356.049,755.775,196.539,755.775,184.539,739.677,196.539,723.578" fill="#FFF9E8" style="stroke:#C4AC70;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="196.539" y="736.71" fill="#000" font-size="14" textLength="159.51" font-family="Arial">Next input line is y or yes,</text><text x="196.539" y="752.809" fill="#000" font-size="14" textLength="126.075" font-family="Arial">ignoring letter case?</text><text x="162.753" y="736.71" fill="#000" font-size="14" textLength="21.786" font-family="Arial">yes</text><text x="368.049" y="736.71" fill="#000" font-size="14" textLength="112.868" font-family="Arial">no, or input ended</text><rect x="16" y="765.775" width="254.22" height="36.099" fill="#F5F8FC" style="stroke:#475569;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="788.907" fill="#000" font-size="14" textLength="234.22" font-family="Arial">execute removes the recipe at INDEX</text><rect x="45.579" y="836.874" width="195.062" height="52.197" fill="#F5F8FC" style="stroke:#475569;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="55.579" y="860.006" fill="#000" font-size="14" textLength="175.062" font-family="Arial">MishMash displays its name</text><text x="55.579" y="876.104" fill="#000" font-size="14" textLength="161.096" font-family="Arial">and the recipes remaining</text><rect x="290.22" y="765.775" width="238.518" height="52.197" fill="#F5F8FC" style="stroke:#475569;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="300.22" y="788.907" fill="#000" font-size="14" textLength="118.262" font-family="Arial">MishMash displays</text><text x="300.22" y="805.006" fill="#000" font-size="14" textLength="218.518" font-family="Arial">"Cancelled. Nothing was changed."</text><polygon points="276.294,895.071,288.294,907.071,276.294,919.071,264.294,907.071,276.294,895.071" fill="#FFF9E8" style="stroke:#C4AC70;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M307.294,929.071 L307.294,954.219 L287.294,958.219 L307.294,962.219 L307.294,987.367 A0,0 0 0 0 307.294,987.367 L557.865,987.367 A0,0 0 0 0 557.865,987.367 L557.865,939.071 L547.865,929.071 L307.294,929.071 A0,0 0 0 0 307.294,929.071" style="stroke:#C4AC70;stroke-width:0.5;" fill="#FFF9E8"/><path d="M547.865,929.071 L547.865,939.071 L557.865,939.071 L547.865,929.071" style="stroke:#C4AC70;stroke-width:0.5;" fill="#FFF9E8"/><text x="313.294" y="947.203" fill="#000" font-size="14" textLength="217.896" font-family="Arial">Nothing is removed unless the final</text><text x="313.294" y="963.302" fill="#000" font-size="14" textLength="229.571" font-family="Arial">check passes. Every other path ends</text><text x="313.294" y="979.4" fill="#000" font-size="14" textLength="201.585" font-family="Arial">with the recipe book unchanged.</text><ellipse cx="276.294" cy="958.219" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="276.294" cy="958.219" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="276.294" y1="72.099" x2="276.294" y2="92.099" style="stroke:#475569;stroke-width:1;"/><polygon points="272.294,82.099,276.294,92.099,280.294,82.099,276.294,86.099" fill="#475569" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="276.294" y1="258.641" x2="276.294" y2="280.74" style="stroke:#475569;stroke-width:1;"/><polygon points="272.294,270.74,276.294,280.