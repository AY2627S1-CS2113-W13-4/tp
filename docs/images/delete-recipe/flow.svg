<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1014px" preserveAspectRatio="none" style="width:594px;height:1014px;background:#FFFFFF;" version="1.1" viewBox="0 0 594 1014" width="594px" zoomAndPan="magnify"><title>Deleting a recipe: where each outcome is decided</title><defs/><g><g class="title" data-source-line="7"><text fill="#000000" font-family="Arial" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="339.9238" x="125.5912" y="33.5625">Deleting a recipe: where each outcome is decided</text></g><ellipse cx="285.5437" cy="57.9395" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F5F8FC" height="36.9395" rx="12.5" ry="12.5" style="stroke:#475569;stroke-width:0.5;" width="236.2891" x="167.3992" y="87.9395"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="216.2891" x="177.3992" y="111.502">User enters delete-recipe INDEX</text><rect fill="#F5F8FC" height="53.8789" rx="12.5" ry="12.5" style="stroke:#475569;stroke-width:0.5;" width="249.4482" x="160.8196" y="205.2275"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="229.4482" x="170.8196" y="228.79">Parser throws MishMashException</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="193.1152" x="170.8196" y="245.7295">with the delete-recipe format</text><rect fill="#F5F8FC" height="36.9395" rx="12.5" ry="12.5" style="stroke:#475569;stroke-width:0.5;" width="207.5166" x="181.7854" y="282.0459"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="187.5166" x="191.7854" y="305.6084">MishMash displays the error</text><ellipse cx="285.5437" cy="349.9854" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="285.5437" cy="349.9854" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#FFF9E8" points="152.5027,144.8789,418.5847,144.8789,430.5847,161.8184,418.5847,178.7578,152.5027,178.7578,140.5027,161.8184,152.5027,144.8789" style="stroke:#C4AC70;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="16.666" x="289.5437" y="192.3203">no</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="266.082" x="152.5027" y="158.4414">INDEX is a single positive whole number</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="133.752" x="152.5027" y="175.3809">within the int range?</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="23.4199" x="430.5847" y="158.4414">yes</text><rect fill="#F5F8FC" height="36.9395" rx="12.5" ry="12.5" style="stroke:#475569;stroke-width:0.5;" width="337.8438" x="116.6218" y="463.334"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="317.8438" x="126.6218" y="486.8965">confirmationPrompt throws MishMashException</text><rect fill="#F5F8FC" height="53.8789" rx="12.5" ry="12.5" style="stroke:#475569;stroke-width:0.5;" width="207.5166" x="181.7854" y="520.2734"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="187.5166" x="191.7854" y="543.8359">MishMash displays the error</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="167.7266" x="191.7854" y="560.7754">and all command formats</text><ellipse cx="285.5437" cy="605.1523" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="285.5437" cy="605.1523" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#FFF9E8" points="174.8083,402.9854,396.2791,402.9854,408.2791,419.9248,396.2791,436.8643,174.8083,436.8643,162.8083,419.9248,174.8083,402.9854" style="stroke:#C4AC70;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="23.4199" x="289.5437" y="450.4268">yes</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="164.0146" x="174.8083" y="416.5479">Recipe book is empty, or</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="221.4707" x="174.8083" y="433.4873">INDEX exceeds the recipe count?</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="16.666" x="408.2791" y="416.5479">no</text><rect fill="#F5F8FC" height="53.8789" rx="12.5" ry="12.5" style="stroke:#475569;stroke-width:0.5;" width="422.9443" x="74.0715" y="658.1523"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="102.1426" x="84.0715" y="681.7148">MishMash asks</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="402.9443" x="84.0715" y="698.6543">"Are you sure you want to delete recipe INDEX: name? (y/n)"</text><polygon fill="#FFF9E8" points="200.2278,732.0313,370.8596,732.0313,382.8596,748.9707,370.8596,765.9102,200.2278,765.9102,188.2278,748.9707,200.2278,732.0313" style="stroke:#C4AC70;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="170.6318" x="200.2278" y="745.5938">Next input line is y or yes,</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="134.75" x="200.2278" y="762.5332">ignoring letter case?</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="23.4199" x="164.8079" y="745.5938">yes</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="121.0098" x="382.8596" y="745.5938">no, or input ended</text><rect fill="#F5F8FC" height="36.9395" rx="12.5" ry="12.5" style="stroke:#475569;stroke-width:0.5;" width="267.5771" x="11" y="775.9102"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="247.5771" x="21" y="799.4727">execute removes the recipe at INDEX</text><rect fill="#F5F8FC" height="53.8789" rx="12.5" ry="12.5" style="stroke:#475569;stroke-width:0.5;" width="206.0469" x="41.7651" y="847.8496"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="186.0469" x="51.7651" y="871.4121">MishMash displays its name</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="171.9512" x="51.7651" y="888.3516">and the recipes remaining</text><rect fill="#F5F8FC" height="53.8789" rx="12.5" ry="12.5" style="stroke:#475569;stroke-width:0.5;" width="255.4434" x="298.5771" y="775.9102"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="126.2529" x="308.5771" y="799.4727">MishMash displays</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="235.4434" x="308.5771" y="816.4121">"Cancelled. Nothing was changed."</text><polygon fill="#FFF9E8" points="285.5437,907.7285,297.5437,919.7285,285.5437,931.7285,273.5437,919.7285,285.5437,907.7285" style="stroke:#C4AC70;stroke-width:0.5;"/><path d="M316.5437,941.7285 L316.5437,968.1377 L296.5437,972.1377 L316.5437,976.1377 L316.5437,1002.5469 A0,0 0 0 0 316.5437,1002.5469 L582.1062,1002.5469 A0,0 0 0 0 582.1062,1002.5469 L582.1062,951.7285 L572.1062,941.7285 L316.5437,941.7285 A0,0 0 0 0 316.5437,941.7285" fill="#FFF9E8" style="stroke:#C4AC70;stroke-width:0.5;"/><path d="M572.1062,941.7285 L572.1062,951.7285 L582.1062,951.7285 L572.1062,941.7285" fill="#FFF9E8" style="stroke:#C4AC70;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="233.208" x="322.5437" y="960.291">Nothing is removed unless the final</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="244.5625" x="322.5437" y="977.2305">check passes. Every other path ends</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="217.3896" x="322.5437" y="994.1699">with the recipe book unchanged.</text><ellipse cx="285.5437" cy="972.1377" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="285.5437" cy="972.1377" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#475569;stroke-width:1;" x1="285.5437" x2="285.5437" y1="67.9395" y2="87.9395"/><polygon fill="#475569" points="281.5437,77.9395,285.5437,87.9395,289.5437,77.9395,285.5437,81.9395" style="stroke:#475569;stroke-width:1;"/><line style="stroke:#475569;stroke-width:1;" x1="285.5437" x2="285.5437" y1="259.1064" y2="282.0459"/><polygon fill="#475569" points="281.5437,272.0459,285.5437,282.0459,289.5437,272.0459,285.5437,276.0459" style="stroke:#475569;stroke-width:1;"/><line style="stroke:#475569;stroke-width:1;" x1="285.5437" x2="285.5437" y1="318.9854" y2="338.9854"/><polygon fill="#475569" points="281.5437,328.9854,285.5437,338.9854,289.5437,328.9854,285.5437,332.9854" style="stroke:#475569;stroke-width:1;"/><line style="stroke:#475569;stroke-width:1;" x1="285.5437" x2="285.5437" y1="178.7578" y2="205.2275"/><polygon fill="#475569" points="281.5437,195.2275,285.5437,205.2275,289.5437,195.2275,285.5437,199.2275" style="stroke:#475569;stroke-width:1;"/><line style="stroke:#475569;stroke-width:1;" x1="430.5847" x2="442.5847" y1="161.8184" y2="161.8184"/><polygon fill="#475569" points="438.5847,269.1064,442.5847,279.1064,446.5847,269.1064,442.5847,273.1064" style="stroke:#475569;stroke-width:1;"/><line style="stroke:#475569;stroke-width:1;" x1="442.5847" x2="442.5847" y1="161.8184" y2="382.9854"/><line style="stroke:#475569;stroke-width:1;" x1="442.5847" x2="285.5437" y1="382.9854" y2="382.9854"/><line style="stroke:#475569;stroke-width:1;" x1="285.5437" x2="285.5437" y1="382.9854" y2="402.9854"/><polygon 